# CPU-only by default. On an NVIDIA GPU machine add the GPU override:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
name: content-agents

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    # Not published to the host, so it won't clash with a native Ollama on port 11434.

  # One-shot: downloads the models named in .env (first run only; later runs are instant).
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - for m in $${WRITER_MODEL:-qwen3:8b} $${FAST_MODEL:-qwen3:4b} $${SCRIPT_MODEL:-}; do echo "pulling $$m"; ollama pull $$m || exit 1; done
    restart: "no"

  agents:
    build: .
    image: content-agents:latest
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ./data:/app/data
      - ./content_agents/sources.yaml:/app/content_agents/sources.yaml:ro

volumes:
  ollama-models:
